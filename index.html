<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./style.css">
    <script src="script.js"></script>
    <link href="https://fonts.googleapis.com/css?family=Lovers+Quarrel" rel="stylesheet">
</head>

<body>
    <div class="fun-bride-groom">
        <div class="fun-bride">
            <img src="https://cdn.jsdelivr.net/gh/yar98/bearhuyen/image/shared/bride-removebg-preview.png" width="50" />
        </div>
        <div class="fun-groom">
            <img id="fun-groom-img" src="https://cdn.jsdelivr.net/gh/yar98/bearhuyen/image/shared/groom-removebg-preview.png" width="50" />
            <div class="fun-family">
                <img src="https://cdn.jsdelivr.net/gh/yar98/bearhuyen/image/shared/family-removebg.png" width="100" />
            </div>
        </div>
    </div>
    <div class="main-content">
        <div class="book">
            <div id="first-page" class="page cover-image">
                <div class="main-cover-image">
                    <div class="introduction-content">
                        <div class="header-content">
                            <div>
                                <p>Tùng</p>
                            </div>
                            <img src="https://cdn.jsdelivr.net/gh/yar98/bearhuyen/image/shared/red-radio-heart.svg"
                                width="80">
                            <div>
                                <p>Huyền</p>
                            </div>
                        </div>
                        <div>
                            <p>Dec 01, 2025</p>
                        </div>
                    </div>
                    <div class="sub-cover-image">
                        <div class="sub-cover-image-a">
                            <img
                                src="https://cdn.jsdelivr.net/gh/yar98/bearhuyen/image/first-page-opti/sub-red-cover-removebgv1.png">
                        </div>
                    </div>
                </div>

            </div>
            <div id="first-page-back" class="page"></div>
            <div id="second-page" class="page">
                <div class="time-text">
                    <p>
                        Hẹn 10h30 thứ 7 nha
                    </p>
                </div>
                <div class="address-text">
                    <div class="sub-address-text">
                        <div>
                            Khách sạn Sơn Nam
                        </div>
                        <div class="sub-address-text-b">
                            26 Lê Hồng Phong
                        </div>
                        <div class="sub-address-text-b">
                            Phường Nam Định
                        </div>
                        <div class="sub-address-text-b">
                            Tỉnh Ninh Bình
                        </div>
                        <div class="sub-address-text-a">
                            <a target="_blank"
                                href="https://www.google.com/maps/place/Hotel+Son+Nam/@20.4292699,106.1816648,17z/data=!3m1!4b1!4m6!3m5!1s0x3135e748325fd335:0x79de8d6a5d010888!8m2!3d20.4292699!4d106.1816648!16s%2Fg%2F1tj711vv?entry=ttu&g_ep=EgoyMDI1MTEwNC4xIKXMDSoASAFQAw%3D%3D">
                                Xem trên google map
                            </a>
                        </div>
                    </div>

                </div>
            </div>
            <div id="second-page-back" class="page"></div>
            <div id="third-page" class="page">
                <div id="my-quote">
                    <p>Chỉ cần em bên cạnh, bầu trời trên đầu có hay không cũng đếch quan trọng =)</p>
                </div>
                <div id="third-page-cover">

                </div>
            </div>
            <div id="third-page-back" class="page"></div>
            <div id="last-page">
                <span>Thank you</span>
                <div id="frog"></div>
            </div>
        </div>
    </div>
</body>

</html>
